<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hikvision PTZ Bridge</title>
<style>
  :root{
    --bg:#0f1114; --panel:#171a1f; --panel2:#1d2127; --line:#282e37;
    --fg:#e7eaf0; --muted:#8b93a1; --accent:#4c8dff; --ok:#2fa46c;
    --bad:#e5484d; --warn:#d9a441; --r:8px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; padding:16px;
  }
  header{max-width:1120px;margin:0 auto 14px}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:16px;font-weight:600;margin:0;letter-spacing:0}
  .status{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}

  .tabs{display:flex;gap:6px;margin-top:12px;overflow-x:auto;padding-bottom:2px}
  .tabs button{
    appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);
    padding:6px 12px;border-radius:var(--r);font:inherit;font-size:13px;cursor:pointer;
    white-space:nowrap;flex:none;
  }
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}

  main{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
  @media (max-width:880px){ main{grid-template-columns:minmax(0,1fr)} }

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
  .panel h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px;letter-spacing:0}
  .frame{position:relative;background:#000;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
  .frame img{width:100%;height:100%;object-fit:contain;display:block}
  .frame img,.frame video{width:100%;height:100%;object-fit:contain;display:block}
  .frame video{background:#000}
  .snapmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;pointer-events:none;text-align:center;padding:12px}
  .snapmsg.hide{display:none}

  .row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .row > label{color:var(--muted);font-size:13px;flex:none}
  .muted{color:var(--muted);font-size:12px}
  .grow{flex:1}

  .seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel2)}
  .seg button{
    appearance:none;border:0;background:transparent;color:var(--muted);
    padding:6px 11px;font:inherit;font-size:13px;cursor:pointer;min-width:44px;
    border-right:1px solid var(--line);transition:background .12s,color .12s;
  }
  .seg button:last-child{border-right:0}
  .seg button:hover{color:var(--fg)}
  .seg button.on{background:var(--accent);color:#fff}

  .btn{
    appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--fg);
    border-radius:var(--r);padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover:not(:disabled){background:#242a33;border-color:#39424f}
  .btn:disabled{opacity:.45;cursor:default}
  .btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

  .pad{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(3,62px);gap:8px;justify-content:center;margin:2px auto 8px}
  .pad button{
    appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--fg);
    border-radius:var(--r);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .12s,border-color .12s,transform .06s;padding:0;
  }
  .pad button:hover:not(:disabled){background:#242a33;border-color:#39424f}
  .pad button:active:not(:disabled){transform:scale(.96)}
  .pad button:disabled{opacity:.45;cursor:default}
  .pad svg{width:25px;height:25px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  #stop{grid-column:2;grid-row:2;border-color:#5a2a2c;background:#2a1a1c;color:#ff9a9d}
  #stop:hover:not(:disabled){background:#3a2124;border-color:#7a3538}
  #stop svg{width:19px;height:19px;fill:currentColor;stroke:none}
  [data-dir=up]{grid-column:2;grid-row:1}
  [data-dir=left]{grid-column:1;grid-row:2}
  [data-dir=right]{grid-column:3;grid-row:2}
  [data-dir=down]{grid-column:2;grid-row:3}

  .talk{width:100%;justify-content:center;padding:14px;font-size:15px;font-weight:600;
    background:#1b2a22;border-color:#2f5b45;color:#9be7bd;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .talk:hover:not(:disabled){background:#213328;border-color:#3d7a5b}
  .talk.live{background:#5a1d20;border-color:#8c3134;color:#ffd7d8}
  .talk.live:hover:not(:disabled){background:#6b2427}

  .notice{margin-top:10px;border:1px solid #5a4a20;background:#2a2415;color:#e8cf8a;
    border-radius:var(--r);padding:9px 10px;font-size:12px;line-height:1.55}
  .notice.hide{display:none}
  .notice code{background:#1a1710;border:1px solid #4a3f1c;border-radius:4px;padding:0 4px}

  .log{margin-top:10px;border-top:1px solid var(--line);padding-top:9px;height:96px;overflow:auto;font-size:12px;color:var(--muted)}
  .log div{padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log .e{color:#ff9a9d}
  .log .s{color:#7fd7a6}

  input[type=text]{appearance:none;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:var(--r);padding:7px 9px;font:inherit;font-size:13px;min-width:0}
  input[type=password]{appearance:none;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:var(--r);padding:9px 10px;font:inherit;font-size:14px;min-width:0;width:100%}
  .file{display:none}
  .login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    padding:20px;background:rgba(9,11,14,.94)}
  .login.hide{display:none}
  .loginbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:18px;width:100%;max-width:330px;display:flex;flex-direction:column;gap:10px}
  .loginbox h2{margin:0;font-size:15px;font-weight:600}
  .loginbox p{margin:0}
  .loginerr{color:#ff9a9d;font-size:12px;min-height:16px}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Hikvision PTZ Bridge</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">连接中…</span></div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <section class="panel">
    <div class="frame" id="frame">
      <video id="live" controls playsinline autoplay muted></video>
      <img id="snap" alt="">
      <div class="snapmsg" id="snapMsg">正在加载画面…</div>
    </div>
    <div class="row">
      <label>播放</label>
      <div class="seg" id="playerSeg">
        <button data-player="webrtc" class="on">WebRTC</button>
        <button data-player="mse">兼容模式</button>
      </div>
      <span class="grow"></span>
      <span class="muted" id="playerHint"></span>
    </div>
    <div class="row">
      <label>刷新</label>
      <div class="seg" id="rateSeg">
        <button data-rate="0">关</button>
        <button data-rate="1000">1 秒</button>
        <button data-rate="2000" class="on">2 秒</button>
        <button data-rate="5000">5 秒</button>
      </div>
      <span class="grow"></span>
      <span class="muted" id="snapTime"></span>
    </div>
    <div class="row">
      <button class="btn" id="capture">
        <svg viewBox="0 0 24 24"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.2l1-1.5h8.6l1 1.5h1.2A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/><circle cx="12" cy="12.5" r="3.2"/></svg>
        抓图下载
      </button>
      <button class="btn" id="refresh">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 5v6h-6"/></svg>
        立即刷新
      </button>
      <button class="btn" id="liveToggle">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M8 10l4 2-4 2z"/></svg>
        实时画面
      </button>
      <button class="btn" id="soundToggle" disabled>
        <svg viewBox="0 0 24 24"><path d="M5 9v6h4l5 4V5L9 9z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>
        开启声音
      </button>
    </div>
  </section>

  <section class="panel">
    <h2>云台</h2>
    <div class="pad">
      <button data-dir="up"    title="上"><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
      <button data-dir="left"  title="左"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button id="stop"        title="停止"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></button>
      <button data-dir="right" title="右"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      <button data-dir="down"  title="下"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div class="row" style="justify-content:center">
      <label>步进</label>
      <div class="seg" id="stepSeg">
        <button data-step="0.2">0.2s</button>
        <button data-step="0.5" class="on">0.5s</button>
        <button data-step="1">1s</button>
        <button data-step="2">2s</button>
      </div>
    </div>

    <h2 style="margin-top:14px">喊话</h2>
    <button class="btn talk" id="talk">点击开始喊话</button>
    <div class="row" style="justify-content:center">
      <button class="btn" id="pickFile">
        <svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/></svg>
        播放音频文件
      </button>
      <span class="muted" id="fileInfo"></span>
      <input class="file" type="file" id="file" accept="audio/*">
    </div>
    <div class="notice hide" id="notice"></div>
    <div class="log" id="log"></div>
  </section>
</main>

<div class="login hide" id="login">
  <form class="loginbox" id="loginForm">
    <h2>需要密码</h2>
    <p class="muted">该网桥已开启访问密码（插件配置里的 auth_token）。</p>
    <input type="password" id="password" placeholder="密码" autocomplete="current-password">
    <button class="btn" type="submit" id="loginBtn" style="justify-content:center">登录</button>
    <div class="loginerr" id="loginErr"></div>
  </form>
</div>

<script>
(function () {
  "use strict";

  var qs = new URLSearchParams(location.search);
  var TOKEN = qs.get("token") || localStorage.getItem("hikbridge.token") || "";
  if (qs.get("token")) localStorage.setItem("hikbridge.token", qs.get("token"));
  // 页面既可以直接打开（http://<主机>:8654/），也可以从 HA 侧边栏通过
  // ingress 打开（/api/hassio_ingress/<token>/）。全部用相对路径，
  // 两种入口才能共用同一份代码。
  var PATH_BASE = location.pathname.replace(/[^/]*$/, "").replace(/\/$/, "");
  var BASE = location.origin + PATH_BASE;

  var $ = function (id) { return document.getElementById(id); };
  var dot = $("dot"), statusText = $("statusText");
  var snap = $("snap"), snapMsg = $("snapMsg"), snapTime = $("snapTime");
  var live = $("live"), liveToggle = $("liveToggle"), soundToggle = $("soundToggle");
  var logBox = $("log"), tabsBox = $("tabs"), notice = $("notice");
  var frame = $("frame"), playerSeg = $("playerSeg"), playerHint = $("playerHint");
  var talkBtn = $("talk"), fileInput = $("file"), fileInfo = $("fileInfo");
  var padButtons = Array.prototype.slice.call(document.querySelectorAll("[data-dir]"));
  var stopBtn = $("stop");

  var cameras = [];
  var current = null;
  var step = 0.5;
  var busyUntil = 0;
  var snapTimer = null, snapRate = 2000, lastSnap = 0;
  // Port of the optional HTTPS listener, reported by /health. Browsers need
  // a secure origin before they hand out microphone access.
  var httpsPort = null;

  function log(text, cls) {
    var row = document.createElement("div");
    if (cls) row.className = cls;
    row.textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false }) + "  " + text;
    logBox.appendChild(row);
    while (logBox.childNodes.length > 60) logBox.removeChild(logBox.firstChild);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function setStatus(ok, text) {
    dot.className = "dot " + (ok === null ? "" : ok ? "ok" : "bad");
    statusText.textContent = text;
  }

  function showNotice(html) {
    notice.innerHTML = html;
    notice.classList.remove("hide");
  }

  function withToken(url) {
    if (!TOKEN) return url;
    return url + (url.indexOf("?") >= 0 ? "&" : "?") + "token=" + encodeURIComponent(TOKEN);
  }

  function api(path, opts) {
    opts = opts || {};
    return fetch(withToken(BASE + path), opts).then(function (resp) {
      if (resp.status === 401) {
        askToken();
        throw new Error("需要访问令牌");
      }
      return resp;
    });
  }

  function askToken() {
    TOKEN = "";
    localStorage.removeItem("hikbridge.token");
    showLogin();
  }

  function post(path, payload) {
    var opts = { method: "POST", cache: "no-store" };
    if (payload !== undefined) {
      opts.headers = { "Content-Type": "application/json" };
      opts.body = JSON.stringify(payload);
    }
    return api(path, opts);
  }

  // ---- 摄像头列表 ----
  function loadCameras() {
    return api("/health").then(function (r) { return r.json(); }).then(function (info) {
      cameras = (info.cameras && info.cameras.length)
        ? info.cameras
        : [{ id: "", name: info.serial || "camera", serial: info.serial }];
      webRtcAvailable = !!info.webrtc;
      updatePlayerUi();
      buildTabs();
      select(cameras[0].id);
      setStatus(true, "已连接 · " + cameras.length + " 台摄像头");
    }).catch(function (e) {
      setStatus(false, "连接失败");
      log("无法读取摄像头列表：" + e.message, "e");
    });
  }

  function buildTabs() {
    tabsBox.innerHTML = "";
    if (cameras.length < 2) return;
    cameras.forEach(function (cam) {
      var b = document.createElement("button");
      b.textContent = cam.name || cam.id;
      b.dataset.id = cam.id;
      b.addEventListener("click", function () { select(cam.id); });
      tabsBox.appendChild(b);
    });
  }

  function camPath(id, suffix) {
    return "/api/cameras/" + encodeURIComponent(id) + suffix;
  }

  function select(id) {
    if (current && current.id === id) return;
    stopTalk();
    liveState.restarting = false;
    stopLive(false);
    liveState.webRtcFallback = false;
    current = cameras.filter(function (c) { return c.id === id; })[0] || cameras[0];
    Array.prototype.forEach.call(tabsBox.children, function (b) {
      b.classList.toggle("on", b.dataset.id === current.id);
    });
    log("切换到 " + (current.name || current.id));
    applyRate(snapRate);
    if (current.live) startLive();
    else if (snapRate > 0) loadSnap();
  }

  // ---- 抓图 ----
  function loadSnap() {
    lastSnap = Date.now();
    snap.src = withToken(BASE + camPath(current.id, "/snapshot.jpg") + "?t=" + lastSnap);
  }

  snap.addEventListener("load", function () {
    snapMsg.classList.add("hide");
    setStatus(true, "已连接");
    snapTime.textContent = new Date(lastSnap).toLocaleTimeString("zh-CN", { hour12: false }) + " 更新";
  });
  snap.addEventListener("error", function () {
    if (liveState.active) return;
    snapMsg.textContent = "取不到画面";
    snapMsg.classList.remove("hide");
    setStatus(false, "取图失败");
  });

  function applyRate(rate) {
    snapRate = rate;
    if (snapTimer) { clearInterval(snapTimer); snapTimer = null; }
    if (rate > 0) {
      snapMsg.textContent = "正在加载画面…";
      snapMsg.classList.remove("hide");
      // Do not keep polling snapshots behind a live MSE stream: those SDK
      // requests compete with the RTSP/ffmpeg process on the same camera.
      if (!liveState.active) loadSnap();
      snapTimer = setInterval(function () {
        if (!liveState.active) loadSnap();
      }, rate);
    } else {
      snapMsg.textContent = "预览已关闭";
      snapMsg.classList.remove("hide");
    }
  }

  $("rateSeg").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-rate]");
    if (!b) return;
    Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle("on", x === b); });
    applyRate(Number(b.dataset.rate));
  });

  $("stepSeg").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-step]");
    if (!b) return;
    Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle("on", x === b); });
    step = Number(b.dataset.step);
    log("步进设为 " + step + "s");
  });

  $("refresh").addEventListener("click", loadSnap);
  $("capture").addEventListener("click", function () {
    var a = document.createElement("a");
    a.href = withToken(BASE + camPath(current.id, "/snapshot.jpg") + "?download=1&t=" + Date.now());
    a.download = "";
    document.body.appendChild(a);
    a.click();
    a.remove();
    log("已请求抓图下载");
  });

  // ---- 实时画面：优先 WebRTC，失败自动回退 MSE/RTSP relay ----
  var LIVE_KEEP_SECONDS = 3;
  var LIVE_MAX_LAG = 1.2;
  var LIVE_MAX_QUEUE_BYTES = 8 * 1024 * 1024;
  var streamMode = localStorage.getItem("hikbridge.player") || "webrtc";
  var webRtcAvailable = false;
  var liveState = {
    source: null, buffer: null, abort: null, objectUrl: null, ws: null,
    queue: [], queueBytes: 0, active: false, restarting: false,
    mode: "mse", pc: null, remoteStream: null, hasAudio: null,
    watchdog: null, lastFrameAt: 0, retries: 0, webRtcFallback: false,
    transport: "ws", wsFallback: false, wsReceived: false
  };

  function updatePlayerUi() {
    if (!webRtcAvailable && streamMode === "webrtc") streamMode = "mse";
    Array.prototype.forEach.call(playerSeg.children, function (b) {
      b.classList.toggle("on", b.dataset.player === streamMode);
      if (b.dataset.player === "webrtc") b.disabled = !webRtcAvailable;
    });
    playerHint.textContent = webRtcAvailable ? "" : "WebRTC 未启用，使用兼容模式";
  }

  function liveMime() {
    var MS = window.MediaSource || window.ManagedMediaSource;
    var hasAudio = !!(current && current.audio_codec);
    var candidates = hasAudio ? [
      'video/mp4; codecs="avc1.42E01E,mp4a.40.2"',
      'video/mp4; codecs="avc1.4D401F,mp4a.40.2"',
      'video/mp4; codecs="avc1.640028,mp4a.40.2"',
      'video/mp4; codecs="avc1.64001F,mp4a.40.2"',
      'video/mp4; codecs="avc1.42E01E"',
      'video/mp4'
    ] : [
      'video/mp4; codecs="avc1.42E01E"',
      'video/mp4; codecs="avc1.4D401F"',
      'video/mp4; codecs="avc1.640028"',
      'video/mp4; codecs="avc1.64001F"',
      'video/mp4'
    ];
    for (var i = 0; i < candidates.length; i++) {
      if (!MS.isTypeSupported || MS.isTypeSupported(candidates[i])) return candidates[i];
    }
    return "";
  }

  function setLiveUi(on, hasAudio) {
    liveToggle.textContent = on ? "关闭实时" : "实时画面";
    if (!on) {
      soundToggle.textContent = "开启声音";
      soundToggle.disabled = true;
    } else if (hasAudio === false) {
      soundToggle.textContent = "无音轨";
      soundToggle.disabled = true;
    } else {
      soundToggle.disabled = false;
      soundToggle.textContent = live.muted ? "开启声音" : "声音已开启";
    }
  }

  function clearLiveWatchdog() {
    if (liveState.watchdog) {
      clearInterval(liveState.watchdog);
      liveState.watchdog = null;
    }
  }

  function touchLive() { liveState.lastFrameAt = Date.now(); }

  function startLiveWatchdog() {
    clearLiveWatchdog();
    touchLive();
    liveState.watchdog = setInterval(function () {
      if (!liveState.active || liveState.restarting) return;
      if (Date.now() - liveState.lastFrameAt > 7000) {
        if (liveState.mode === "webrtc") {
          handleWebRTCFailure(new Error("WebRTC 超过 7 秒没有画面"));
        } else {
          restartLive("画面超过 7 秒没有推进");
        }
      }
    }, 2000);
  }

  function stopLive(resumeSnap) {
    if (resumeSnap !== false) {
      liveState.restarting = false;
      liveState.retries = 0;
    }
    liveState.active = false;
    clearLiveWatchdog();
    if (liveState.abort) { try { liveState.abort.abort(); } catch (e) {} }
    if (liveState.ws) { try { liveState.ws.close(); } catch (e) {} }
    if (liveState.pc) { try { liveState.pc.close(); } catch (e) {} }
    if (liveState.source && liveState.source.readyState === "open") {
      try { liveState.source.endOfStream(); } catch (e) {}
    }
    liveState.source = null;
    liveState.buffer = null;
    liveState.abort = null;
    liveState.ws = null;
    liveState.pc = null;
    liveState.remoteStream = null;
    liveState.queue = [];
    liveState.queueBytes = 0;
    if (liveState.objectUrl) {
      try { URL.revokeObjectURL(liveState.objectUrl); } catch (e) {}
      liveState.objectUrl = null;
    }
    try { live.pause(); } catch (e) {}
    try { live.srcObject = null; } catch (e) {}
    live.removeAttribute("src");
    try { live.load(); } catch (e) {}
    live.style.display = "none";
    snap.style.display = "";
    frame.classList.remove("live-on");
    liveState.hasAudio = null;
    setLiveUi(false);
    if (resumeSnap !== false && snapRate > 0) loadSnap();
  }

  function failLive(err) {
    if (!liveState.active) return;
    var message = err && err.message ? err.message : String(err || "未知错误");
    log("实时画面不可用：" + message, "e");
    stopLive();
    showNotice("实时画面加载失败，已保留抓图预览。<br>" + message);
  }

  function liveBufferedEnd() {
    var sb = liveState.buffer;
    if (!sb || !sb.buffered.length) return null;
    return sb.buffered.end(sb.buffered.length - 1);
  }

  function syncLive() {
    if (!liveState.active || live.seeking) return;
    var end = liveBufferedEnd();
    if (end === null) return;
    if (end - live.currentTime > LIVE_MAX_LAG) {
      try { live.currentTime = Math.max(0, end - 0.25); } catch (e) {}
    }
  }

  function trimLive() {
    var sb = liveState.buffer;
    if (!sb || sb.updating || !sb.buffered.length) return;
    syncLive();
    var start = sb.buffered.start(0);
    var end = sb.buffered.end(sb.buffered.length - 1);
    var removeTo = end - LIVE_KEEP_SECONDS;
    if (live.currentTime > start) removeTo = Math.min(removeTo, live.currentTime - 0.5);
    if (removeTo > start + 0.1) {
      try { sb.remove(start, removeTo); } catch (e) {}
    }
  }

  function pumpLive() {
    var sb = liveState.buffer;
    if (!sb || sb.updating || !liveState.queue.length) return;
    var chunk = liveState.queue.shift();
    liveState.queueBytes -= chunk.byteLength || chunk.length;
    try {
      sb.appendBuffer(chunk);
    } catch (e) {
      if (e.name === "QuotaExceededError") {
        liveState.queue.unshift(chunk);
        liveState.queueBytes += chunk.byteLength || chunk.length;
        trimLive();
        setTimeout(pumpLive, 150);
      } else {
        failLive(e);
      }
    }
  }

  function restartLive(reason) {
    if (!liveState.active || liveState.restarting) return;
    liveState.retries += 1;
    if (liveState.retries > 5) {
      var message = (reason || "视频流中断") + "，自动重连多次仍失败";
      stopLive();
      showNotice("实时画面已停止。<br>" + message);
      return;
    }
    liveState.restarting = true;
    var id = current && current.id;
    log((reason || "实时画面中断") + "，正在重新连接…", "e");
    stopLive(false);
    setTimeout(function () {
      liveState.restarting = false;
      if (current && current.id === id) startLive();
    }, Math.min(500 * liveState.retries, 2500));
  }

  function enqueueLive(chunk) {
    if (!liveState.active) return;
    liveState.queue.push(chunk);
    liveState.queueBytes += chunk.byteLength || chunk.length;
    if (liveState.queueBytes > LIVE_MAX_QUEUE_BYTES) {
      restartLive("实时画面积压");
      return;
    }
    pumpLive();
  }

  function handleWebRTCFailure(err) {
    if (!liveState.webRtcFallback) {
      liveState.webRtcFallback = true;
      streamMode = "mse";
      updatePlayerUi();
      log("WebRTC 不可用，切换到兼容模式：" + (err && err.message ? err.message : err), "e");
      stopLive(false);
      setTimeout(startLive, 250);
      return;
    }
    failLive(err);
  }

  function waitForIce(pc) {
    if (pc.iceGatheringState === "complete") return Promise.resolve();
    return new Promise(function (resolve) {
      var timer = setTimeout(done, 2500);
      function done() {
        clearTimeout(timer);
        pc.removeEventListener("icegatheringstatechange", changed);
        resolve();
      }
      function changed() { if (pc.iceGatheringState === "complete") done(); }
      pc.addEventListener("icegatheringstatechange", changed);
    });
  }

  function startWebRTC() {
    var Ctor = window.RTCPeerConnection || window.webkitRTCPeerConnection;
    if (!Ctor) { handleWebRTCFailure(new Error("浏览器不支持 WebRTC")); return; }
    stopLive(false);
    notice.classList.add("hide");
    var pc = new Ctor({ iceServers: [] });
    var remote = new MediaStream();
    liveState.mode = "webrtc";
    liveState.pc = pc;
    liveState.remoteStream = remote;
    liveState.hasAudio = !!current.audio_codec;
    liveState.active = true;
    live.srcObject = remote;
    live.style.display = "none";
    snap.style.display = "";
    snapMsg.textContent = "正在连接 WebRTC…";
    snapMsg.classList.remove("hide");
    setLiveUi(true, liveState.hasAudio);
    pc.addTransceiver("video", { direction: "recvonly" });
    if (liveState.hasAudio) pc.addTransceiver("audio", { direction: "recvonly" });
    pc.ontrack = function (ev) {
      if (ev.streams && ev.streams[0]) {
        liveState.remoteStream = ev.streams[0];
        live.srcObject = ev.streams[0];
      } else if (ev.track && remote.getTracks().indexOf(ev.track) < 0) {
        remote.addTrack(ev.track);
      }
      if (ev.track && ev.track.kind === "audio") {
        liveState.hasAudio = true;
        setLiveUi(true, true);
      }
      touchLive();
      live.muted = false;
      live.volume = 1;
      live.play().then(function () {
        setLiveUi(true, liveState.hasAudio);
      }).catch(function () {
        live.muted = true;
        setLiveUi(true, liveState.hasAudio);
        live.play().catch(function () {});
      });
    };
    pc.onconnectionstatechange = function () {
      if (pc.connectionState === "failed" && liveState.active) restartLive("WebRTC 连接失败");
    };
    pc.createOffer().then(function (offer) {
      return pc.setLocalDescription(offer);
    }).then(function () {
      return waitForIce(pc);
    }).then(function () {
      return post(camPath(current.id, "/webrtc"), { sdp: pc.localDescription.sdp });
    }).then(function (resp) {
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      return resp.json();
    }).then(function (answer) {
      if (!answer.ok) throw new Error(answer.error || "WebRTC SDP 交换失败");
      return pc.setRemoteDescription({ type: "answer", sdp: answer.sdp });
    }).then(function () {
      startLiveWatchdog();
    }).catch(function (e) {
      if (liveState.active) handleWebRTCFailure(e);
    });
  }

  function startMSE() {
    var MS = window.MediaSource || window.ManagedMediaSource;
    if (!MS) {
      showNotice("当前浏览器不支持实时 MP4 播放，已保留抓图预览。");
      return;
    }
    stopLive(false);
    notice.classList.add("hide");
    var source = new MS();
    liveState.mode = "mse";
    liveState.source = source;
    liveState.objectUrl = URL.createObjectURL(source);
    liveState.hasAudio = !!current.audio_codec;
    liveState.transport = "ws";
    liveState.wsFallback = false;
    liveState.wsReceived = false;
    source.addEventListener("sourceopen", openSource);
    live.src = liveState.objectUrl;
    live.style.display = "none";
    snap.style.display = "";
    snapMsg.textContent = "正在连接实时画面…";
    snapMsg.classList.remove("hide");
    liveState.active = true;
    setLiveUi(true, liveState.hasAudio);
    live.muted = false;
    live.volume = 1;
    live.play().then(function () {
      setLiveUi(true, liveState.hasAudio);
    }).catch(function () {
      live.muted = true;
      setLiveUi(true, liveState.hasAudio);
      live.play().catch(function () {});
    });

    function openSource() {
      if (!liveState.active || liveState.source !== source) return;
      var mime = liveMime();
      if (!mime) { failLive(new Error("浏览器不支持 MP4/AAC")); return; }
      try { liveState.buffer = source.addSourceBuffer(mime); }
      catch (e) { failLive(e); return; }
      liveState.buffer.mode = "segments";
      liveState.buffer.addEventListener("updateend", function () {
        syncLive(); trimLive(); pumpLive();
      });
      startLiveSocket();
    }
  }

  function startLiveSocket() {
    if (!window.WebSocket) { startLiveHttp(); return; }
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    var ws;
    try {
      ws = new WebSocket(withToken(
        proto + "//" + location.host + PATH_BASE + camPath(current.id, "/live.ws")
      ));
    } catch (e) {
      startLiveHttp();
      return;
    }
    liveState.ws = ws;
    ws.binaryType = "arraybuffer";
    ws.onopen = function () {
      if (!liveState.active || liveState.ws !== ws) return;
      startLiveWatchdog();
    };
    ws.onmessage = function (ev) {
      if (!liveState.active || liveState.ws !== ws) return;
      if (typeof ev.data === "string") {
        try {
          var info = JSON.parse(ev.data);
          if (info && info.ok === false) throw new Error(info.error || "实时流被拒绝");
        } catch (e) {
          failLive(e);
        }
        return;
      }
      liveState.wsReceived = true;
      touchLive();
      enqueueLive(new Uint8Array(ev.data));
    };
    ws.onerror = function () {
      if (liveState.active && !liveState.wsReceived) fallbackLiveHttp();
    };
    ws.onclose = function () {
      if (!liveState.active || liveState.ws !== ws) return;
      if (liveState.wsReceived) restartLive("实时流连接已断开");
      else fallbackLiveHttp();
    };
  }

  function fallbackLiveHttp() {
    if (!liveState.active || liveState.transport !== "ws" || liveState.wsFallback) return;
    liveState.wsFallback = true;
    liveState.transport = "http";
    var ws = liveState.ws;
    liveState.ws = null;
    if (ws) { try { ws.close(); } catch (e) {} }
    log("实时 WebSocket 不可用，切换到 HTTP 兼容模式…", "e");
    setTimeout(startLiveHttp, 400);
  }

  function startLiveHttp() {
    if (!liveState.active || !current) return;
    liveState.transport = "http";
    var controller = new AbortController();
    liveState.abort = controller;
    fetch(withToken(BASE + camPath(current.id, "/live.mp4")), {
      cache: "no-store", signal: controller.signal
    }).then(function (resp) {
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      if (!resp.body || !resp.body.getReader) throw new Error("浏览器不支持流式响应");
      var reader = resp.body.getReader();
      startLiveWatchdog();
      (function read() {
        reader.read().then(function (result) {
          if (result.done) {
            if (liveState.active) restartLive("实时流已结束");
            return;
          }
          liveState.wsReceived = true;
          touchLive();
          enqueueLive(new Uint8Array(result.value));
          read();
        }).catch(function (e) {
          if (e.name !== "AbortError" && liveState.active) failLive(e);
        });
      })();
    }).catch(function (e) {
      if (e.name !== "AbortError" && liveState.active) failLive(e);
    });
  }


  function startLive() {
    if (!current || !current.live) {
      showNotice("该摄像头没有配置 <code>rtsp_url</code>，只能使用抓图预览。");
      return;
    }
    if (streamMode === "webrtc" && webRtcAvailable) { startWebRTC(); return; }
    startMSE();
  }

  playerSeg.addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-player]");
    if (!b || b.disabled) return;
    streamMode = b.dataset.player;
    liveState.webRtcFallback = false;
    localStorage.setItem("hikbridge.player", streamMode);
    updatePlayerUi();
    if (liveState.active) {
      stopLive(false);
      setTimeout(startLive, 200);
    } else if (current && current.live) startLive();
  });

  liveToggle.addEventListener("click", function () {
    if (liveState.active || liveState.restarting) {
      liveState.restarting = false;
      stopLive();
    } else startLive();
  });
  soundToggle.addEventListener("click", function () {
    if (!liveState.active || liveState.hasAudio === false) return;
    live.muted = false;
    live.volume = 1;
    live.play().then(function () {
      setLiveUi(true, liveState.hasAudio);
    }).catch(function (e) { log("声音开启失败：" + e.message, "e"); });
  });
  live.addEventListener("playing", function () {
    live.style.display = "block";
    snap.style.display = "none";
    snapMsg.classList.add("hide");
    frame.classList.add("live-on");
    touchLive();
    setStatus(true, liveState.mode === "webrtc" ? "WebRTC 实时画面" : "实时画面");
  });
  live.addEventListener("timeupdate", function () { touchLive(); syncLive(); });
  live.addEventListener("ended", function () {
    if (liveState.active) restartLive("视频流已结束");
  });
  live.addEventListener("error", function () {
    if (liveState.active) failLive(new Error("视频解码失败"));
  });

  // ---- 云台 ----
  function setBusy(ms) {
    busyUntil = Date.now() + ms;
    padButtons.concat([stopBtn]).forEach(function (b) { b.disabled = true; });
    setTimeout(function () {
      if (Date.now() >= busyUntil - 20) {
        padButtons.concat([stopBtn]).forEach(function (b) { b.disabled = false; });
      }
    }, ms);
  }

  function move(dir) {
    if (!current || Date.now() < busyUntil) return;
    setBusy(step * 1000 + 250);
    post(camPath(current.id, "/ptz"), { direction: dir, duration: step })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        setStatus(true, "已连接");
        log("移动 " + dir + " · " + step + "s");
      })
      .catch(function (e) { setStatus(false, "命令失败"); log("移动失败：" + e.message, "e"); });
  }

  function stop() {
    if (!current || Date.now() < busyUntil) return;
    setBusy(400);
    post(camPath(current.id, "/ptz/stop"))
      .then(function () { setStatus(true, "已连接"); log("停止"); })
      .catch(function (e) { log("停止失败：" + e.message, "e"); });
  }

  padButtons.forEach(function (b) {
    b.addEventListener("click", function () { move(b.dataset.dir); });
  });
  stopBtn.addEventListener("click", stop);

  document.addEventListener("keydown", function (ev) {
    if (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA") return;
    var map = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
    if (map[ev.key]) { ev.preventDefault(); move(map[ev.key]); }
    else if (ev.key === " " || ev.key === "Escape") { ev.preventDefault(); stop(); }
  });

  // ---- 喊话 ----
  var talk = { ws: null, ctx: null, stream: null, node: null, sink: null, live: false, mode: "" };

  // AudioWorklet 以 128 帧为处理单位；这里聚合成约 20ms 一块，既避开
  // ScriptProcessor 的 64ms 缓冲，也不会让 WebSocket 每秒发上百个包。
  var TALK_WORKLET_SOURCE = [
    "class HikBridgeTalkProcessor extends AudioWorkletProcessor {",
    "  constructor(options) {",
    "    super();",
    "    var opts = options && options.processorOptions;",
    "    this.chunkSize = (opts && opts.chunkSize) || 256;",
    "    this.buffer = new Float32Array(this.chunkSize);",
    "    this.offset = 0;",
    "  }",
    "  process(inputs) {",
    "    var input = inputs[0] && inputs[0][0];",
    "    if (!input) return true;",
    "    var pos = 0;",
    "    while (pos < input.length) {",
    "      var count = Math.min(this.chunkSize - this.offset, input.length - pos);",
    "      this.buffer.set(input.subarray(pos, pos + count), this.offset);",
    "      this.offset += count;",
    "      pos += count;",
    "      if (this.offset === this.chunkSize) {",
    "        var out = this.buffer.slice();",
    "        this.port.postMessage(out, [out.buffer]);",
    "        this.offset = 0;",
    "      }",
    "    }",
    "    return true;",
    "  }",
    "}",
    "registerProcessor('hikbridge-talk', HikBridgeTalkProcessor);",
  ].join("\n");

  function talkSocket() {
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    return new WebSocket(
      withToken(proto + "//" + location.host + PATH_BASE + camPath(current.id, "/talk"))
    );
  }

  function setTalkUi(live, text) {
    talk.live = live;
    talkBtn.classList.toggle("live", live);
    talkBtn.textContent = text || (live ? "点击结束喊话" : "点击开始喊话");
  }

  function micBlocked() {
    return !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia;
  }

  function showMicHelp() {
    showNotice(
      "浏览器只允许在安全来源（HTTPS 或 localhost）使用麦克风，当前是 " +
      "<code>" + location.origin + "</code>。<br>" +
      "1）在插件配置里把 <code>ssl</code> 打开并重启插件，改用 " +
      "<code>https://" + location.hostname + ":" + (httpsPort || 8655) +
      PATH_BASE + "/</code> 打开本页" +
      "（自签证书浏览器会提示一次，选择继续访问），之后「点击开始喊话」就能用；<br>" +
      "2）或者用「播放音频文件」把录音/文字转好的音频发到摄像头喇叭。"
    );
  }

  // 浏览器可能拒绝 16 kHz 的 AudioContext，这里做个线性重采样兼底。
  function makeResampler(srcRate, dstRate) {
    if (srcRate === dstRate) return function (input) { return input; };
    var ratio = srcRate / dstRate;
    var pos = 0;
    return function (input) {
      var out = [];
      var p = pos;
      while (p < input.length) {
        var i = Math.floor(p);
        var frac = p - i;
        var a = input[i];
        var b = i + 1 < input.length ? input[i + 1] : a;
        out.push(a * (1 - frac) + b * frac);
        p += ratio;
      }
      pos = p - input.length;
      return Float32Array.from(out);
    };
  }

  function floatToPcm16(input) {
    var out = new Int16Array(input.length);
    for (var i = 0; i < input.length; i++) {
      var s = Math.max(-1, Math.min(1, input[i]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    return out;
  }

  function makeTalkContext() {
    var Ctor = window.AudioContext || window.webkitAudioContext;
    try {
      return new Ctor({ sampleRate: 16000, latencyHint: "interactive" });
    } catch (e) {
      return new Ctor({ latencyHint: "interactive" });
    }
  }

  function createTalkWorklet(ctx, onChunk) {
    if (!ctx.audioWorklet || !window.AudioWorkletNode ||
        !window.URL || !window.Blob || !window.URL.createObjectURL) {
      return Promise.resolve(null);
    }
    var url = window.URL.createObjectURL(new Blob([TALK_WORKLET_SOURCE], {
      type: "application/javascript"
    }));
    talk.workletUrl = url;
    return ctx.audioWorklet.addModule(url).then(function () {
      var node = new window.AudioWorkletNode(ctx, "hikbridge-talk", {
        numberOfInputs: 1,
        numberOfOutputs: 1,
        outputChannelCount: [1],
        processorOptions: {
          // Align the microphone chunk with the camera's 20 ms AAC frames.
          chunkSize: Math.max(128, Math.round(ctx.sampleRate * 0.020))
        }
      });
      node.port.onmessage = function (ev) { onChunk(ev.data); };
      return node;
    }).catch(function () {
      if (talk.workletUrl === url) {
        try { window.URL.revokeObjectURL(url); } catch (e) {}
        talk.workletUrl = null;
      }
      return null;
    });
  }

  function sendTalkChunk(input, resample) {
    if (!talk.live || !talk.ws || talk.ws.readyState !== 1) return;
    // If the camera or the bridge is behind, drop stale microphone data
    // instead of building an ever-growing audio delay.
    if (talk.ws.bufferedAmount > 4096) return;
    var pcm = floatToPcm16(resample ? resample(input) : input);
    try { talk.ws.send(pcm.buffer); } catch (e) {}
  }

  function startTalk() {
    if (talk.live || !current) return;
    if (micBlocked()) { showMicHelp(); return; }
    notice.classList.add("hide");
    setTalkUi(true, "正在连接…");
    log("正在打开麦克风…");

    navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        sampleRate: 16000,
        latency: 0,
        // Push-to-talk goes to a camera speaker, not back to the local
        // WebAudio output.  Disabling browser DSP avoids the extra capture
        // buffer that echo cancellation inserts on many platforms.
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    }).then(function (stream) {
      talk.stream = stream;
      talk.mode = "mic";
      var ctx = makeTalkContext();
      return ctx.resume().then(function () {
        talk.ctx = ctx;
        var ws = talkSocket();
        talk.ws = ws;
        ws.binaryType = "arraybuffer";
        ws.onmessage = function (ev) {
          try {
            var msg = JSON.parse(ev.data);
            if (msg.ok === false) {
              log("网桥拒绝喊话：" + (msg.error || "busy"), "e");
              stopTalk();
            }
          } catch (err) { /* 忽略非 JSON 帧 */ }
        };
        ws.onclose = function () {
          if (talk.live) { log("喊话通道已关闭", "e"); stopTalk(); }
        };
        ws.onerror = function () { log("喊话通道出错", "e"); };
        return new Promise(function (resolve) {
          ws.onopen = function () {
            ws.send(JSON.stringify({ rate: 16000 }));
            resolve();
          };
        });
      });
    }).then(function () {
      var ctx = talk.ctx;
      var src = ctx.createMediaStreamSource(talk.stream);
      var resample = makeResampler(ctx.sampleRate, 16000);
      var sink = ctx.createGain();
      sink.gain.value = 0;
      return createTalkWorklet(ctx, function (samples) {
        sendTalkChunk(samples, resample);
      }).then(function (node) {
        var worklet = !!node;
        if (!node) {
          // Fallback for browsers without AudioWorklet.
          var size = ctx.sampleRate >= 32000 ? 512 : 256;
          node = ctx.createScriptProcessor(size, 1, 1);
          node.onaudioprocess = function (ev) {
            sendTalkChunk(ev.inputBuffer.getChannelData(0), resample);
          };
        }
        if (!talk.live || talk.ctx !== ctx) {
          try { node.disconnect(); } catch (e) {}
          return;
        }
        src.connect(node);
        node.connect(sink);
        sink.connect(ctx.destination);
        talk.node = node;
        talk.sink = sink;
        talk.mode = worklet ? "worklet" : "script";
        setTalkUi(true, "正在喊话 · 点击结束");
        log(worklet ? "麦克风已连接（低延迟）" : "麦克风已连接", "s");
      });
    }).catch(function (e) {
      log("麦克风不可用：" + e.message, "e");
      showMicHelp();
      stopTalk();
    });
  }

  function stopTalk() {
    var wasLive = talk.live;
    if (talk.node) { try { talk.node.disconnect(); } catch (e) {} }
    if (talk.sink) { try { talk.sink.disconnect(); } catch (e) {} }
    if (talk.ctx) { try { talk.ctx.close(); } catch (e) {} }
    if (talk.stream) { talk.stream.getTracks().forEach(function (t) { t.stop(); }); }
    if (talk.ws) {
      if (talk.ws.readyState === 1) {
        try { talk.ws.send(JSON.stringify({ cmd: "stop" })); } catch (e) {}
      }
      try { talk.ws.close(); } catch (e) {}
    }
    if (talk.workletUrl) {
      try { window.URL.revokeObjectURL(talk.workletUrl); } catch (e) {}
    }
    talk.ws = null; talk.ctx = null; talk.stream = null;
    talk.node = null; talk.sink = null; talk.mode = ""; talk.workletUrl = null;
    setTalkUi(false, "点击开始喊话");
    if (wasLive) log("喊话结束");
  }

  talkBtn.addEventListener("click", function (ev) {
    ev.preventDefault();
    if (talk.live) stopTalk(); else startTalk();
  });
  ["contextmenu", "copy", "selectstart"].forEach(function (name) {
    talkBtn.addEventListener(name, function (ev) { ev.preventDefault(); });
  });

  // ---- 播放音频文件（无需麦克风权限）----
  $("pickFile").addEventListener("click", function () { fileInput.click(); });

  fileInput.addEventListener("change", function () {
    var file = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if (!file || !current) return;
    fileInfo.textContent = file.name;
    notice.classList.add("hide");
    log("正在解码 " + file.name + " …");

    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    file.arrayBuffer()
      .then(function (buf) { return ctx.decodeAudioData(buf); })
      .then(function (decoded) {
        var frames = Math.max(1, Math.ceil(decoded.duration * 16000));
        var off = new OfflineAudioContext(1, frames, 16000);
        var src = off.createBufferSource();
        src.buffer = decoded;
        src.connect(off.destination);
        src.start();
        return off.startRendering();
      })
      .then(function (rendered) {
        var pcm = floatToPcm16(rendered.getChannelData(0));
        return playPcm(pcm);
      })
      .then(function () { log("音频已发送完毕", "s"); })
      .catch(function (e) { log("音频播放失败：" + e.message, "e"); })
      .then(function () { try { ctx.close(); } catch (e) {} });
  });

  function playPcm(pcm) {
    return new Promise(function (resolve, reject) {
      var ws = talkSocket();
      talk.ws = ws;
      talk.mode = "file";
      var offset = 0;
      var chunk = 1600; // 100 ms @16 kHz mono PCM16
      ws.binaryType = "arraybuffer";
      ws.onerror = function () { reject(new Error("喊话通道出错")); };
      ws.onclose = function () {
        if (talk.mode === "file") { talk.ws = null; talk.mode = ""; setTalkUi(false, "点击开始喊话"); }
        resolve();
      };
      ws.onmessage = function (ev) {
        try {
          var msg = JSON.parse(ev.data);
          if (msg.ok === false) { log("网桥拒绝喊话：" + (msg.error || "busy"), "e"); }
        } catch (e) { /* 忽略 */ }
      };
      ws.onopen = function () {
        ws.send(JSON.stringify({ rate: 16000 }));
        setTalkUi(true, "正在播放音频");
        log("开始播放到摄像头喇叭");
        (function pump() {
          if (ws.readyState !== 1) { resolve(); return; }
          var end = Math.min(offset + chunk, pcm.length);
          ws.send(pcm.subarray(offset, end).buffer);
          offset = end;
          if (offset >= pcm.length) {
            setTimeout(function () {
              try { ws.send(JSON.stringify({ cmd: "stop" })); ws.close(); } catch (e) {}
              setTalkUi(false, "点击开始喊话");
              talk.mode = "";
            }, 350);
            return;
          }
          setTimeout(pump, 100);
        })();
      };
    });
  }

  // ---- 访问密码 ----
  var loginBox = $("login"), loginForm = $("loginForm"), loginBtn = $("loginBtn");
  var loginErr = $("loginErr"), passwordInput = $("password");
  var started = false;

  function showLogin(message) {
    loginErr.textContent = message || "";
    loginBox.classList.remove("hide");
    setTimeout(function () { passwordInput.focus(); }, 30);
  }

  loginForm.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var value = passwordInput.value;
    if (!value) return;
    loginBtn.disabled = true;
    loginErr.textContent = "";
    fetch(BASE + "/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: value })
    }).then(function (resp) {
      return resp.json().then(function (body) { return { status: resp.status, body: body }; });
    }).then(function (res) {
      loginBtn.disabled = false;
      if (res.status === 200 && res.body && res.body.ok) {
        TOKEN = value;
        localStorage.setItem("hikbridge.token", TOKEN);
        passwordInput.value = "";
        loginBox.classList.add("hide");
        start();
        return;
      }
      loginErr.textContent = "密码不正确";
      passwordInput.select();
    }).catch(function (e) {
      loginBtn.disabled = false;
      loginErr.textContent = "无法连接：" + e.message;
    });
  });

  function start() {
    if (started) return;
    started = true;
    log("网桥 " + BASE);
    loadCameras();
    fetch(withToken(BASE + "/health"))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (info) {
        if (!info) return;
        if (info.https_port) httpsPort = info.https_port;
        webRtcAvailable = !!info.webrtc;
        updatePlayerUi();
      })
      .catch(function () {});
    setInterval(function () {
      api("/health").then(function (r) { return r.json(); }).then(function (info) {
        webRtcAvailable = !!info.webrtc;
        updatePlayerUi();
        setStatus(true, "已连接");
      })
        .catch(function () { setStatus(false, "网桥无响应"); });
    }, 20000);
  }

  function boot() {
    fetch(BASE + "/api/auth").then(function (r) { return r.json(); }).then(function (auth) {
      if (!auth.required) { start(); return; }
      if (!TOKEN) { showLogin(); return; }
      return fetch(withToken(BASE + "/health")).then(function (r) {
        if (r.status === 401) {
          TOKEN = "";
          localStorage.removeItem("hikbridge.token");
          showLogin("登录已过期，请重新输入密码");
        } else {
          start();
        }
      });
    }).catch(function () { start(); });
  }

  window.addEventListener("beforeunload", stopTalk);
  window.addEventListener("beforeunload", function () { stopLive(false); });
  boot();
})();
</script>
</body>
</html>
