name: "Hikvision PTZ Bridge"
version: "0.2.24"
slug: "hikbridge"
description: "PTZ control, snapshots, live two-way talk and speaker playback for Hikvision/EZVIZ cameras over the private protocol (TCP 8000)"
url: "https://github.com/wangling75/ha-hikbridge"
image: "ghcr.io/wangling75/amd64-hikbridge"
arch:
  - amd64
startup: application
boot: auto
init: false
host_network: true
hassio_api: true
ingress: true
ingress_port: 8654
panel_icon: "mdi:webcam"
panel_title: "云台摄像头"
panel_admin: false
options:
  cameras: []
  speak_sample_rate: 16000
  auth_token: ""
  # Serve the web UI over HTTPS with a self-signed certificate. Browsers
  # only allow microphone capture on secure origins, so this is what makes
  # the press-to-talk button work. The certificate is created on first start.
  ssl: false
  ssl_port: 8655
  certfile: ""
  keyfile: ""
  # Optional built-in WebRTC playback. No Scrypted or external gateway is
  # required; the add-on bundles go2rtc and proxies its SDP exchange.
  webrtc: true
  # Keep these separate from HA's own go2rtc (usually 1984/8555).
  # The internal RTSP relay also uses an ephemeral loopback port, so it
  # never takes HA's 8554.
  # "auto" reuses the go2rtc that Home Assistant already runs, so the
  # plugin exposes no WebRTC port of its own: the browser only needs to
  # reach Home Assistant. Media uses HA's WebRTC port when it is
  # reachable and the same-origin MSE fallback (through HA ingress)
  # otherwise. Set "bundled" to force the add-on's own go2rtc, which is
  # what a plain Docker deployment maps.
  webrtc_backend: auto
  # Loopback API of Home Assistant's built-in go2rtc and the TCP port its
  # WebRTC listener advertises (HA's own defaults).
  ha_go2rtc_api: "http://127.0.0.1:11984"
  ha_webrtc_port: 18555
  webrtc_port: 18554
  webrtc_api_port: 11985
  webrtc_candidates: []
schema:
  cameras:
    - id: str?
      name: str?
      camera_ip: str
      camera_port: port?
      username: str?
      password: password?
      channel: int?
      rtsp_url: str?
  speak_sample_rate: list(8000|16000)
  auth_token: str?
  ssl: bool?
  ssl_port: port?
  certfile: str?
  keyfile: str?
  webrtc: bool?
  webrtc_backend: list(auto|bundled|home_assistant)?
  ha_go2rtc_api: url?
  ha_webrtc_port: port?
  webrtc_port: port?
  webrtc_api_port: port?
  webrtc_candidates:
    - str?
  # Accept old STUN/TURN settings, but the runtime intentionally ignores them.
  webrtc_ice_servers:
    - str?
