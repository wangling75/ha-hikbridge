name: Build add-on image

on:
  push:
    branches: [main]
    paths:
      - "hikbridge/**"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./hikbridge
          file: ./hikbridge/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/amd64-hikbridge:latest
            ghcr.io/${{ github.repository_owner }}/amd64-hikbridge:0.1.0

      - name: Verify public image
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER}"
          token=$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:${owner}/amd64-hikbridge:pull" | jq -r .token)
          curl -fsS -o /dev/null \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${owner}/amd64-hikbridge/manifests/0.1.0"
          echo "Public GHCR image available: ghcr.io/${owner}/amd64-hikbridge:0.1.0"
