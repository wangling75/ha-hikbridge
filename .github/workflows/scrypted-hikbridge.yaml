name: Build Scrypted HikBridge plugin

on:
  push:
    branches: [main]
    tags:
      - "scrypted-hikbridge-v*"
    paths:
      - "scrypted-hikbridge/**"
      - ".github/workflows/scrypted-hikbridge.yaml"
  pull_request:
    paths:
      - "scrypted-hikbridge/**"
      - ".github/workflows/scrypted-hikbridge.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrypted-hikbridge
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: scrypted-hikbridge/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build plugin
        run: pnpm run build

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: scrypted-hikbridge-plugin
          path: scrypted-hikbridge/dist/plugin.zip
          if-no-files-found: error

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/scrypted-hikbridge-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: scrypted-hikbridge
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: scrypted-hikbridge/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
