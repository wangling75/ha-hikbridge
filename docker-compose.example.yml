services:
  hikbridge:
    image: ghcr.io/wangling75/amd64-hikbridge:0.2.22
    container_name: hikbridge
    restart: unless-stopped
    ports:
      - "8654:8654"
      - "18554:18554/tcp"
      - "18554:18554/udp"
    environment:
      HIK_TIMEZONE: Asia/Shanghai
    volumes:
      - ./options.json:/data/options.json:ro
