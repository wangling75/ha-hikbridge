services:
  hikbridge:
    image: ghcr.io/wangling75/amd64-hikbridge:0.2.14
    container_name: hikbridge
    restart: unless-stopped
    ports:
      - "8654:8654"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    environment:
      HIK_TIMEZONE: Asia/Shanghai
    volumes:
      - ./options.json:/data/options.json:ro
